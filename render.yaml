services:
  - type: web
    name: app-noticias
    env: node
    buildCommand: cd app && npm install && npx expo export --platform web --output-dir dist
    startCommand: npm install && node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_VERSION
        value: 22
    healthCheckPath: /api/stats