name: Keepalive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app para evitar sleep
        run: |
          curl -fsS -m 60 "https://${{ vars.HF_SPACE_URL }}/api/stats" || true
          curl -fsS -m 60 -X POST "https://${{ vars.HF_SPACE_URL }}/api/cron" || true