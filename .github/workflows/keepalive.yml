name: Keepalive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app para evitar sleep
        run: |
          curl -fsS -m 60 "https://balocuun-noticiascoe.hf.space/api/stats" || true
          curl -fsS -m 60 -X POST "https://balocuun-noticiascoe.hf.space/api/cron" || true