name: Keepalive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          # TODO: fijar URL real de Suga cuando exista el proyecto:
          # https://<service-id>-production-<region>.suga.run
          # Suga es always-on y no duerme; este workflow queda como monitor opcional.
          # Para activar el cron, descomentar la seccion "schedule" y los ping con la URL real.
          curl -fsS -m 60 "https://REEMPLAZAR.suga.run/api/stats" || true
          curl -fsS -m 60 -X POST "https://REEMPLAZAR.suga.run/api/cron" || true