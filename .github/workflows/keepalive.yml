name: Keepalive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app para monitorizar uptime
        run: |
          curl -fsS -m 60 "https://dioimgulfrk0-production-3hf80vbp.us-central1.suga.run/api/stats" || true
          curl -fsS -m 60 -X POST "https://dioimgulfrk0-production-3hf80vbp.us-central1.suga.run/api/cron" || true